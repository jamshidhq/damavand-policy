[package]
name = "damavand-policy"
# 0.0.0 on purpose: rust-release.yaml bumps max(latest tag, this value) by the
# PR label, so the first `minor` release becomes 0.1.0.
version = "0.0.0"
edition = "2024"
rust-version = "1.89"
description = "Deterministic policy gateway (Cedar) for damavand agent-safety crates"
license = "Apache-2.0"
repository = "https://github.com/jamshidhq/damavand-policy"
readme = "README.md"
keywords = ["cedar", "policy", "authorization", "agent"]
categories = ["authentication"]

[features]
# Reusable conformance cases (bundle + request -> expected outcome).
conformance = []

[dependencies]
cedar-policy = "=4.14.0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
proptest = { version = "1", default-features = false, features = ["std"] }
serde_norway = "0.9"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
